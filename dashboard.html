      function showStatus(message, isError = false) {
        const box = $('status');
        box.textContent = message;
        box.className = `mb-4 text-xs font-bold p-3 rounded ${isError ? 'text-brandRed bg-red-50 border-2 border-brandRed' : 'text-green-700 bg-green-50 border-2 border-green-700'}`;
        box.classList.remove('hidden');
      }

      function clean(value) {
        return value.trim().replace(/[<>]/g, '').slice(0, 80);
      }

      function normalizeUrl(value) {
        const trimmed = value.trim();
        const withProtocol = /^https?:\/\//i.test(trimmed) ? trimmed : `https://${trimmed}`;
        return new URL(withProtocol).href;
      }

      function isVisible(node) {
        if (!node || node.hidden || node.deleted) return false;
        let parentId = node.parent;
        while (parentId) {
          const parent = nodes.find((item) => item.id === parentId);
          if (!parent || parent.hidden || parent.deleted) return false;
          parentId = parent.parent;
        }
        return true;
      }

      function parentOptions(type) {
        if (type === 'countries') return nodes.filter((node) => node.id === 'root');
        if (type === 'categories') return nodes.filter((node) => node.type === 'countries' && !node.deleted);
        if (type === 'brands') return nodes.filter((node) => node.type === 'categories' && !node.deleted);
        return [];
      }

      function updateLevel(node) {
        const parent = nodes.find((item) => item.id === node.parent);
        node.level = parent ? parent.level + 1 : 1;
      }

      function markDeleted(nodeId) {
        const node = nodes.find((item) => item.id === nodeId);
        if (!node) return;
        node.deleted = true;
        nodes.filter((item) => item.parent === nodeId).forEach((child) => markDeleted(child.id));
      }

      function serializeNodes() {
        return nodes.map((node) => ({
          id: node.id,
          label: node.label,
          parent: node.parent,
          level: node.level,
          type: node.type,
          desc: node.desc || '',
          website: node.website || '',
          brand: Boolean(node.brand),
          hidden: Boolean(node.hidden),
          deleted: Boolean(node.deleted)
        }));
      }

      async function loadDefaultNodesFromIndex() {
        return defaultNodes.map((node) => ({ ...node }));
      }

      function mergeNodes(defaultNodes, savedNodes) {
        const savedById = new Map((savedNodes || []).map((node) => [node.id, node]));
        const merged = defaultNodes.map((defaultNode) => ({
          ...defaultNode,
          ...(savedById.get(defaultNode.id) || {})
        }));
        const defaultIds = new Set(defaultNodes.map((node) => node.id));
        const customSaved = (savedNodes || []).filter((node) => !defaultIds.has(node.id));
        return [...merged, ...customSaved];
      }

      async function loadNodes() {
        const defaults = await loadDefaultNodesFromIndex();
        const snapshot = await getDoc(mapRef);
        const saved = snapshot.exists() && Array.isArray(snapshot.data().nodes) ? snapshot.data().nodes : [];
        nodes = mergeNodes(defaults, saved);
      }

      async function loadSiteInfo() {
        const snapshot = await getDoc(siteInfoRef);
        siteInfo = {
          ...defaultSiteInfo,
          ...(snapshot.exists() ? snapshot.data() : {})
        };
      }

      async function saveNodes(message) {
        await setDoc(mapRef, {
          nodes: serializeNodes(),
          updatedAt: serverTimestamp(),
          updatedBy: auth.currentUser.email || auth.currentUser.uid
        }, { merge: true });
        render();
        showStatus(message);
      }

      async function saveSiteInfo() {
        siteInfoKeys.forEach((key) => {
          siteInfo[key] = $(`site-${key}`).value.trim();
        });

        await setDoc(siteInfoRef, {
          ...siteInfo,
          updatedAt: serverTimestamp(),
          updatedBy: auth.currentUser.email || auth.currentUser.uid
        }, { merge: true });

        showStatus('Website info saved.');
      }

      function fillParentSelect(select, type, currentParent = '') {
        select.innerHTML = parentOptions(type).map((parent) => (
          `<option value="${parent.id}" ${parent.id === currentParent ? 'selected' : ''}>${parent.label}</option>`
        )).join('');
      }

      function syncSelectedNode() {
        const node = nodes.find((item) => item.id === $('node-select').value);
        if (!node) return;
        $('node-label').value = node.label || '';
        $('node-desc').value = node.desc || '';
        $('node-website').value = node.website || '';
        $('node-hidden').checked = Boolean(node.hidden);
        fillParentSelect($('node-parent'), node.type, node.parent);
      }

      function render() {
        const visible = nodes.filter(isVisible);
        $('country-count').textContent = visible.filter((node) => node.parent === 'root').length;
        $('category-count').textContent = visible.filter((node) => node.type === 'categories').length;
        $('brand-count').textContent = visible.filter((node) => node.type === 'brands' && node.brand).length;

        const editable = nodes.filter((node) => node.id !== 'root');
        const previous = $('node-select').value;
        $('node-select').innerHTML = editable.map((node) => (
          `<option value="${node.id}" ${node.id === previous ? 'selected' : ''}>${node.type}: ${node.label}${node.hidden ? ' (hidden)' : ''}${node.deleted ? ' (deleted)' : ''}</option>`
        )).join('');
        if (!$('node-select').value && editable[0]) $('node-select').value = editable[0].id;
        syncSelectedNode();
        fillParentSelect($('new-parent'), $('new-type').value);
      }

      function renderSiteInfo() {
        siteInfoKeys.forEach((key) => {
          $(`site-${key}`).value = siteInfo[key] || '';
        });
      }

      $('login-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        $('login-error').classList.add('hidden');
        try {
          await signInWithEmailAndPassword(auth, $('email').value.trim(), $('password').value);
          $('login-form').reset();
        } catch {
          $('login-error').textContent = 'Email or password is not correct.';
          $('login-error').classList.remove('hidden');
        }
      });

      $('signout').addEventListener('click', () => signOut(auth));
      $('node-select').addEventListener('change', syncSelectedNode);
      $('new-type').addEventListener('change', () => fillParentSelect($('new-parent'), $('new-type').value));
      $('restore-default-map').addEventListener('click', async () => {
        nodes = defaultNodes.map((node) => ({ ...node }));
        await saveNodes('Current website categories restored.');
      });

      $('site-info-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        try {
          await saveSiteInfo();
        } catch (error) {
          showStatus(error.message || 'Could not save website info.', true);
        }
      });

      $('edit-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        try {
          const node = nodes.find((item) => item.id === $('node-select').value);
          if (!node) return;
          const label = clean($('node-label').value);
          if (!label) return showStatus('Name is required.', true);
          node.label = label;
          node.desc = $('node-desc').value.trim();
          node.parent = $('node-parent').value || node.parent;
          node.hidden = $('node-hidden').checked;
          node.deleted = false;
          if (node.type === 'brands') {
            node.website = $('node-website').value.trim() ? normalizeUrl($('node-website').value) : '';
            node.brand = true;
          }
          updateLevel(node);
          await saveNodes('Saved.');
        } catch (error) {
          showStatus(error.message || 'Could not save.', true);
        }
      });

      $('delete-node').addEventListener('click', async () => {
        const node = nodes.find((item) => item.id === $('node-select').value);
        if (!node) return;
        markDeleted(node.id);
        await saveNodes('Deleted.');
      });

      $('add-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        try {
          const type = $('new-type').value;
          const label = clean($('new-label').value);
          if (!label) return showStatus('Name is required.', true);
          const node = {
            id: `admin_${type}_${Date.now()}`,
            label,
            parent: $('new-parent').value,
            level: 1,
            type,
            desc: $('new-desc').value.trim(),
            website: '',
            brand: type === 'brands'
          };
          if (type === 'brands') node.website = normalizeUrl($('new-website').value);
          updateLevel(node);
          nodes.push(node);
          $('add-form').reset();
          await saveNodes('Added.');
        } catch (error) {
          showStatus(error.message || 'Could not add item.', true);
        }
      });

      onAuthStateChanged(auth, async (user) => {
        if (!user) {
          $('auth-status').textContent = 'Locked';
          $('login-view').classList.remove('hidden');
          $('dashboard-view').classList.add('hidden');
          return;
        }

        $('auth-status').textContent = 'Unlocked';
        $('admin-email').textContent = user.email || 'admin';
        $('login-view').classList.add('hidden');
        $('dashboard-view').classList.remove('hidden');
        await loadNodes();
        await loadSiteInfo();
        renderSiteInfo();
        render();
      });
    </script>
  </body>
</html>
